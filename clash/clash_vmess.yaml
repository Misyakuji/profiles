# 配置文件头部信息
mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
external-controller: 0.0.0.0:9090

# 路由规则
rules:
  - MATCH,DIRECT

# 代理服务器配置
proxies:
# 亚马逊云
  - name: "VMess-Server2"
    type: vmess
    server: 43.207.185.80
    port: 55555
    uuid: 23313253-1add-46d8-aa86-3fe7ba54efd6
    alterId: 0
    cipher: auto
    # udp: true
    # tls: true
    # skip-cert-verify: true
    # tls-hostname: 填写伪装域名
    # network: ws
    # ws-path: /path
    # ws-headers: #这一行后面不要写东西
    #   Host: v2ray.com # 填写伪装域名

# 代理组配置
proxy-groups:
  - name: "Auto"
    type: select
    proxies:
      - "VMess-Server"
      - DIRECT

# 路由规则组
rules:
  - MATCH,Auto
